name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned ffmpeg
        run: |
          sudo bash scripts/install-ffmpeg.sh /opt/ffmpeg
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH applies to later steps, not to this one.
          ffmpeg=/opt/ffmpeg/bin/ffmpeg
          "$ffmpeg" -hide_banner -version
          encoders="$("$ffmpeg" -hide_banner -encoders)"
          for name in libx264 libx265 libsvtav1; do
            echo "$encoders" | grep -q "$name" || { echo "missing encoder $name"; exit 1; }
          done
          "$ffmpeg" -hide_banner -filters | grep -q libvmaf || { echo "missing libvmaf"; exit 1; }

      - name: Install p7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

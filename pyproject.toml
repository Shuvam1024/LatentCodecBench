[project]
name = "latentcodecbench"
version = "0.0.1"
description = "Benchmark open video VAEs as codecs against x264, x265, and SVT-AV1."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shuvam Mukherjee" }]
keywords = ["benchmark", "codec", "rate-distortion", "vae", "video"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.4"]
vae = [
    "accelerate>=1.1",
    "diffusers>=0.32",
    "safetensors>=0.4",
    "torch>=2.4",
    "transformers>=4.46",
]

[project.urls]
Homepage = "https://github.com/Shuvam1024/LatentCodecBench"
Issues = "https://github.com/Shuvam1024/LatentCodecBench/issues"
Repository = "https://github.com/Shuvam1024/LatentCodecBench"

[project.scripts]
lcb = "latentcodecbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latentcodecbench"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["latentcodecbench"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
pretty = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
